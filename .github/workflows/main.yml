name: build angular

on: 
    push: 
        branches: ['main']

jobs:
    build-angular:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Install dependencies
              run: npm install

            - name: Build Angular app
              run: npm run build
